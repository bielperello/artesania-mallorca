<!DOCTYPE html>
<html lang="ca" class="scroll-smooth scroll-pt-24">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta name="description"
        content="Descobreix l'artesania tradicional de Mallorca. Catàleg interactiu amb mapa, filtres, fitxes detallades i multimèdia." />
    <meta name="theme-color" content="#ec4913" />

    <title>Catàleg Interactiu d'Artesania Mallorquina</title>
    <link class="icon" rel="icon" href="./media/images/logo/logo.png" />

    <!-- Preload de recursos crítics per accelerar el renderitzat inicial (LCP/FCP) -->
    <link rel="preload" href="/css/styles.css" as="style" />
    <link rel="preload" href="/fonts/font-31.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/font-50.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Full d'estils principal (inclou fonts locals, Tailwind i estils customitzats) -->
    <link rel="stylesheet" href="/css/styles.css" />

    <!-- Càrrega asíncrona no bloquejant de Leaflet (el mapa no és al Hero de dalt de tot) -->
    <link rel="stylesheet" href="/css/leaflet.css" media="print" onload="this.media='all'" />
    <noscript>
        <link rel="stylesheet" href="/css/leaflet.css" />
    </noscript>

    <!-- JSON-LD Structured Data (schema.org) per SEO i web semàntica -->
    <script>
        fetch('data/artesanies-LD.json')
            .then(r => r.text())
            .then(json => {
                const el = document.createElement('script');
                el.type = 'application/ld+json';
                el.textContent = json;
                document.head.appendChild(el);
            })
            .catch(() => console.warn('[JSON-LD] No s\'ha pogut carregar el fitxer de dades estructurades.'));
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-body text-slate-900 dark:text-slate-100 antialiased min-h-screen relative">

    <!-- SPA: Tot el contingut es renderitza via JS -->
    <div id="app"></div>

    <!-- Scripts de la SPA clàssics seqüencials carregats de forma estàtica en el directori de producció de Vite -->
    <script src="/js/data.js" defer></script>
    <script src="/js/services.js" defer></script>
    <script src="/js/leaflet.js" defer></script>
    <script src="/js/map.js" defer></script>
    <script src="/js/imageHelper.js" defer></script>
    <script src="/js/templates.js" defer></script>
    <script src="/js/main.js" defer></script>
</body>

</html>
